name: Use the CI image
description: >
  Runs the job's steps in the CI image the ci-image job resolved. When that job built a candidate, the image arrives as a registry artifact and is served from localhost, so dev-image-action pulls it instead of building it again.

inputs:
  image:
    description: The image the ci-image job hands on, its image output.
    required: true
  shared:
    description: The ci-image job's shared output, 'true' when the image came as an artifact.
    required: true
  docker-args:
    description: Passed to h3nc4/dev-image-action as its docker-args.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run actions/download-artifact
      if: inputs.shared == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ci-image
        path: ${{ runner.temp }}/registry
    - name: Serve the CI image from a local registry
      if: inputs.shared == 'true'
      shell: sh
      run: |
        docker run -d --name ci-registry -p 127.0.0.1:5000:5000 \
          -v "${RUNNER_TEMP}/registry:/var/lib/registry" \
          registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        for _ in $(seq 1 30); do
          if curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        docker logs ci-registry >&2
        exit 1
    - name: Run h3nc4/dev-image-action
      uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
      with:
        image: ${{ inputs.image }}
        dockerfile: docker/ci.Dockerfile
        image-inputs: ${{ env.CI_IMAGE_INPUTS }}
        base-sha: ''
        docker-args: ${{ inputs.docker-args }}
