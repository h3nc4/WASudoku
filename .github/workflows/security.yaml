name: Security Analysis

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'
  schedule:
    - cron: '23 3 * * *' # Daily at 03:23 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the fix branch
      pull-requests: write # opens the pull request
    env:
      DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -v ${HOME:?}/ci-cache/cargo:/cache/cargo -e CARGO_HOME=/cache/cargo
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Name the CI image
        id: ci_image
        run: echo "ref=$(./scripts/ci-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@v2
        with:
          image: ${{ steps.ci_image.outputs.ref }}
          base-sha: ''
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
          mkdir -p ~/ci-cache/cargo
      - name: Fix what can be fixed
        id: fix
        if: github.event_name != 'push'
        run: |
          $DEV_RUN -c 'npm audit fix --package-lock-only' || true
          if git diff --quiet -- package.json package-lock.json; then
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
          else
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          fi
      - name: Lint, test and build the fixed tree
        if: steps.fix.outputs.changed == 'true'
        run: |
          $DEV_RUN -c '
            set -e
            export PATH="/cache/cargo/bin:${PATH}"
            ./scripts/wasm-deps.sh -d
            npm ci
            npm run format:check
            npm run lint
            npm run lint:md
            npm run lint:sh
            npm run lint:wasm
            npm run test:wasm
            npm run wasm:build:dev
            npm run typecheck
            npm run test:ui
            npm run build
          '
      - name: Open a pull request for the fix
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_BRANCH: security/audit-fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -qB "${FIX_BRANCH}"
          git commit -qm 'npm audit fix' -- package.json package-lock.json
          git push -qf origin "${FIX_BRANCH}"
          url="$(gh pr list --head "${FIX_BRANCH}" --base main --state open \
            --json url --jq '.[0].url // empty')"
          if [ -z "${url}" ]; then
            url="$(gh pr create --head "${FIX_BRANCH}" --base main \
              --title 'npm audit fix' \
              --body 'Opened by the nightly audit, with the suite already green on this tree.')"
          fi
          echo "::notice::the fix is waiting at ${url}"
      - name: Audit dependencies
        run: |
          $DEV_RUN -c 'npm run audit' >"${RUNNER_TEMP}/audit.log" 2>&1 || status=1
          cat "${RUNNER_TEMP}/audit.log"
          if [ "${status:-0}" -ne 0 ]; then
            {
              echo '## Advisories left for a human'
              echo
              echo '```'
              cat "${RUNNER_TEMP}/audit.log"
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
            echo "::warning::npm audit fix cannot reach these without a major bump"
          fi

  audit-wasm:
    name: Cargo Audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/cargo:/cache/cargo -e CARGO_HOME=/cache/cargo
      CI_IMAGE_INPUTS: docker/ci.Dockerfile scripts/wasm-deps.sh
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Name the CI image
        id: ci_image
        run: echo "ref=$(./scripts/ci-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@v2
        with:
          image: ${{ steps.ci_image.outputs.ref }}
          dockerfile: docker/ci.Dockerfile
          image-inputs: ${{ env.CI_IMAGE_INPUTS }}
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Cache the cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/cargo
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('scripts/wasm-deps.sh', 'src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-
            ${{ runner.os }}-cargo-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/cargo
      - name: Audit cargo dependencies
        run: |
          $DEV_RUN -c '
            set -e
            export PATH="/cache/cargo/bin:${PATH}"
            ./scripts/wasm-deps.sh -d
            npm run audit:wasm
          '

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'rust']

    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run github/codeql-action/init
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
      - name: Run actions/cache
        if: matrix.language == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/wasudoku-wasm/target/
          key: ${{ matrix.language }}-${{ runner.os }}-cargo-${{ hashFiles('src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.language }}-${{ runner.os }}-cargo-
      - name: Run dtolnay/rust-toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: 'wasm32-unknown-unknown'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run actions/setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install UI dependencies
        run: npm ci
      - name: Build project for analysis
        run: |
          npm run wasm:build:prod
          npm run typecheck
      - name: Run github/codeql-action/analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:${{matrix.language}}'
