name: WASudoku Development CI

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -v ${HOME:?}/ci-cache/cargo:/cache/cargo -e CARGO_HOME=/cache/cargo
  CI_IMAGE_INPUTS: docker/ci.Dockerfile scripts/wasm-deps.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Name the CI image
        id: ci_image
        run: echo "ref=$(./scripts/ci-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@v2
        with:
          image: ${{ steps.ci_image.outputs.ref }}
          dockerfile: docker/ci.Dockerfile
          image-inputs: ${{ env.CI_IMAGE_INPUTS }}
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Cache the npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache the cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/cargo
            src/wasudoku-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
          mkdir -p ~/ci-cache/cargo
      - name: Lint, test and build
        run: |
          $DEV_RUN -c '
            set -e
            export PATH="/cache/cargo/bin:${PATH}"
            ./scripts/wasm-deps.sh -d
            npm ci
            npm run format:check
            npm run lint
            npm run lint:md
            npm run lint:sh
            npm run lint:wasm
            npm run test:wasm
            npm run wasm:build:dev
            npm run typecheck
            npm run test:ui
            npm run build
            XZ_OPT=-9e tar -cJf WASudoku-dev.tar.xz -C dist .
          '
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-coverage
          path: coverage-wasm.xml
          retention-days: 1
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-coverage
          path: coverage-ui.lcov
          retention-days: 1
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dev-build
          path: WASudoku-dev.tar.xz
          retention-days: 1

  browser-tests:
    name: Browser Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop Browsers
          - project: chromium
            install: chromium
          - project: firefox
            install: firefox
          - project: webkit
            install: webkit
          # Mobile Viewports
          - project: mobile-chrome
            install: chromium
          - project: mobile-safari
            install: webkit
          - project: pixel-7
            install: chromium
          - project: iphone-15
            install: webkit
          - project: ipad-pro
            install: webkit
          # Branded Desktop
          - project: google-chrome
            install: chrome
          - project: msedge
            install: msedge
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Name the CI image
        id: ci_image
        run: echo "ref=$(./scripts/ci-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@v2
        with:
          image: ${{ steps.ci_image.outputs.ref }}
          dockerfile: docker/ci.Dockerfile
          image-inputs: ${{ env.CI_IMAGE_INPUTS }}
          base-sha: ''
          docker-args: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -v ${HOME:?}/ci-cache/cargo:/cache/cargo -e CARGO_HOME=/cache/cargo -e HOME=/root --user 0:0 --shm-size=1gb
      - name: Cache the npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache the cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/cargo
            src/wasudoku-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
          mkdir -p ~/ci-cache/cargo
      - name: Install, build wasm and run the browser tests
        run: |
          $DEV_RUN -c '
            set -e
            npm ci
            npx playwright install --with-deps ${{ matrix.install }}
            npm run wasm:build:dev
            npm run test:browser -- --project ${{ matrix.project }}
          '

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-coverage
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-coverage
      - name: Run SonarQube analysis
        run: ./scripts/sonar.sh

  build-test-container:
    name: Build and Test Runtime Container
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare metadata
        id: meta
        run: |
          {
            echo "PUSH=${{ github.ref == 'refs/heads/main' }}"
            echo "IMAGE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):latest"
            echo "CI_IMAGE_TAG=$(./scripts/devcontainer-image.sh -t)"
          } >>"$GITHUB_OUTPUT"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Run docker/login-action
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: Build Container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ steps.meta.outputs.PUSH }}
          load: true
          tags: ${{ steps.meta.outputs.IMAGE }}
          build-args: |
            CI_IMAGE_TAG=${{ steps.meta.outputs.CI_IMAGE_TAG }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
      - name: Run container
        run: |
          CONTAINER_ID=$(docker run -d -p 8080:80 ${{ steps.meta.outputs.IMAGE }})
          echo "CONTAINER_ID=$CONTAINER_ID" >>"$GITHUB_ENV"
      - name: Poll container url
        run: |
          for i in $(seq 1 10); do
            if wget -qO- http://localhost:8080/ | grep -q "WASudoku"; then
              echo "Container started successfully."
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 3
          done
          echo "Container did not start." >&2
          docker logs "$CONTAINER_ID" >&2
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_ID"
