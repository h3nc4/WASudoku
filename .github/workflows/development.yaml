name: WASudoku Development CI

on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'
      - 'deps'
  schedule:
    - cron: '30 5 * * *' # Daily at 05:30 UTC
  workflow_dispatch:

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -v ${HOME:?}/ci-cache/cargo:/cache/cargo -e CARGO_HOME=/cache/cargo
  CI_IMAGE_INPUTS: docker/ci.Dockerfile scripts/wasm-deps.sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request run is superseded by the pin push that lands seconds into it, so only one
  # full run is paid for. A push to the default branch still queues, since it deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-image:
    name: Resolve the CI image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.share.outputs.image }}
      artifact: ${{ steps.share.outputs.artifact }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Name the CI image
        id: ci_image
        run: echo "ref=$(./scripts/ci-image.sh)" >>"${GITHUB_OUTPUT}"
      - name: Run h3nc4/dev-image-action/share
        id: share
        uses: h3nc4/dev-image-action/share@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ steps.ci_image.outputs.ref }}
          dockerfile: docker/ci.Dockerfile
          image-inputs: ${{ env.CI_IMAGE_INPUTS }}

  checks:
    name: Lint, test and build
    needs: [ci-image]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check comment length
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/comment-length.sh --base "${BASE_SHA}"
      - name: Test comment length check
        run: sh scripts/comment-length.test.sh
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.ci-image.outputs.image }}
          artifact: ${{ needs.ci-image.outputs.artifact }}
          dockerfile: docker/ci.Dockerfile
          base-sha: ''
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Cache the npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Cache the cargo registry and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('scripts/wasm-deps.sh', 'src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Cache the cargo build for this toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: src/wasudoku-wasm/target/
          key: ${{ runner.os }}-wasm-target-${{ hashFiles('docker/ci.Dockerfile') }}-${{ hashFiles('src/wasudoku-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-target-${{ hashFiles('docker/ci.Dockerfile') }}-
      - name: Create the cache directories
        run: |
          mkdir -p ~/ci-cache/npm
          mkdir -p ~/ci-cache/cargo
      - name: Lint, test and build
        run: |
          $DEV_RUN -c "
            set -e
            export PATH=/cache/cargo/bin:\${PATH}
            ./scripts/wasm-deps.sh -d
            npm ci
            npm run wasm:build:dev
            tar -cf wasm-pkg-dev.tar -C src/wasudoku-wasm pkg
            npm run format:check
            npm run lint
            npm run lint:md
            npm run lint:sh
            npm run lint:type
            npm run lint:wasm
            npm run test:wasm
            npm run typecheck
            npm run test:unit
            npm run check:astro
            npm run build
            sh scripts/budget.test.sh
            npm run budget
            XZ_OPT=-9e tar -cJf WASudoku-dev.tar.xz -C dist .
          "
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-coverage
          path: coverage-wasm.xml
          retention-days: 1
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-coverage
          path: coverage-ui.lcov
          retention-days: 1
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-build
          path: WASudoku-dev.tar.xz
          retention-days: 1
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-pkg-dev
          path: wasm-pkg-dev.tar
          retention-days: 1
      - name: Audit npm and cargo dependencies
        run: |
          $DEV_RUN -c 'npm run audit' >"${RUNNER_TEMP}/audit.log" 2>&1 || status=1
          cat "${RUNNER_TEMP}/audit.log"
          if [ "${status:-0}" -ne 0 ]; then
            {
              echo '## Advisories left for a human'
              echo
              echo '```'
              cat "${RUNNER_TEMP}/audit.log"
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
            echo "::error::npm audit fix cannot reach these without a major bump"
          fi
          $DEV_RUN -c "
            set -e
            export PATH=/cache/cargo/bin:\${PATH}
            npm run audit:wasm
          " || status=1
          exit "${status:-0}"

  font:
    name: Check the font subset
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test which files the font subset reads
        run: ./scripts/font-subset.sh --test
      - name: Rebuild the font subset and compare it with the checked-in files
        run: ./scripts/font-subset.sh --check

  browser-tests:
    name: Browser and End-to-end Test (${{ matrix.engine }})
    needs: [ci-image, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project chromium
          - engine: firefox
            projects: --project firefox
          - engine: webkit
            projects: --project webkit --project iphone-15
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.ci-image.outputs.image }}
          artifact: ${{ needs.ci-image.outputs.artifact }}
          dockerfile: docker/ci.Dockerfile
          base-sha: ''
          docker-args: -v ${HOME:?}/ci-cache/npm:/cache/npm -e npm_config_cache=/cache/npm -e CI -e HOME=/root --user 0:0 --shm-size=1gb
      - name: Cache the npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ci-cache/npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Create the cache directory
        run: mkdir -p ~/ci-cache/npm
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dev-build
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-pkg-dev
      - name: Unpack the build and the wasm package
        run: |
          mkdir -p dist
          tar -xJf WASudoku-dev.tar.xz -C dist
          tar -xf wasm-pkg-dev.tar -C src/wasudoku-wasm
      - name: Install the browser and run the browser and end-to-end tests
        run: |
          $DEV_RUN -c "
            set -e
            npm ci
            npx playwright install --with-deps ${{ matrix.engine }}
            status=0
            npm run test:browser -- ${{ matrix.projects }} || status=\$?
            npm run test:e2e -- ${{ matrix.projects }} || status=\$?
            exit \${status}
          "
      - name: Run actions/upload-artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report/
          retention-days: 7

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-coverage
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-coverage
      - name: Name the image the scan comes from
        run: |
          image="$(sed -n 's|^FROM \(h3nc4/dev-base:[^ ]*\) AS main|\1|p' docker/dev.Dockerfile)"
          case "${image}" in
            h3nc4/dev-base:*@sha256:*) ;;
            *) echo "::error::docker/dev.Dockerfile names no pinned dev-base to take the scan from"; exit 1 ;;
          esac
          echo "SCAN_IMAGE=${image}" >>"${GITHUB_ENV}"
      - name: Take the scan script out of the pinned image
        run: |
          docker run --rm --entrypoint cat "${SCAN_IMAGE}" /usr/local/bin/sonar >"${RUNNER_TEMP}/sonar"
          chmod +x "${RUNNER_TEMP}/sonar"
      - name: Run h3nc4/sonar-action
        uses: h3nc4/sonar-action@c10bc623edc7c789ba88837fa9d330e4341d9f72 # v1
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          script: ${{ runner.temp }}/sonar

  build-test-container:
    name: Build and Test Runtime Container
    needs: [ci-image, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare metadata
        id: meta
        run: |
          {
            echo "PUSH=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
            echo "IMAGE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):latest"
            echo "CI_IMAGE_TAG=$(./scripts/devcontainer-image.sh -t)"
          } >>"$GITHUB_OUTPUT"
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.ci-image.outputs.image }}
          artifact: ${{ needs.ci-image.outputs.artifact }}
          dockerfile: docker/ci.Dockerfile
          base-sha: ''
      - name: Name the resolved image as the Dockerfile expects
        run: docker tag "${DEV_IMAGE:?}" "${{ needs.ci-image.outputs.image }}"
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker
      - name: Run docker/login-action
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>"$GITHUB_OUTPUT"
      - name: Build Container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ steps.meta.outputs.PUSH }}
          load: true
          tags: ${{ steps.meta.outputs.IMAGE }}
          build-args: |
            CI_IMAGE_TAG=${{ steps.meta.outputs.CI_IMAGE_TAG }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
      - name: Run container
        run: |
          CONTAINER_ID=$(docker run -d -p 8080:80 ${{ steps.meta.outputs.IMAGE }})
          echo "CONTAINER_ID=$CONTAINER_ID" >>"$GITHUB_ENV"
      - name: Poll container url
        run: |
          for _ in $(seq 1 10); do
            if wget -qO- http://localhost:8080/ | grep -q "WASudoku"; then
              echo "Container started successfully."
              exit 0
            fi
            echo "Waiting for container to start..."
            sleep 3
          done
          echo "Container did not start." >&2
          docker logs "$CONTAINER_ID" >&2
          exit 1
      - name: Check what each path answers
        run: ./scripts/container-smoke.sh http://localhost:8080
      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER_ID"

  ci-image-cleanup:
    name: Delete the shared CI image
    needs: [ci-image, checks, browser-tests, build-test-container]
    if: always() && needs.ci-image.outputs.artifact != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run h3nc4/dev-image-action/cleanup
        uses: h3nc4/dev-image-action/cleanup@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          artifact: ${{ needs.ci-image.outputs.artifact }}
