# Serves dist from the edge, replacing the nginx container behind the tunnel.
# An assets-only Worker runs no script, so asset requests are never billed.
name = "wasudoku"
compatibility_date = "2026-09-28"

# Off, so the site answers on its own hostname and not on workers.dev too.
workers_dev = false

[assets]
directory = "./dist"

# Replaces `try_files $uri $uri/ /index.html`.
not_found_handling = "single-page-application"

# A route, not a custom domain. A custom domain owns the DNS record and refuses
# while the tunnel's CNAME exists, which is code 100117.

# A route intercepts ahead of the origin, so DNS is untouched and deleting the
# route sends traffic back down the tunnel.
[[routes]]
pattern = "wasudoku.h3nc4.com/*"
zone_name = "h3nc4.com"
