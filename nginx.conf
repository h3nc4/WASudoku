# Automatically set the number of worker processes based on available CPUs
worker_processes auto;

# Run NGINX in the foreground (required for Docker)
daemon off;

# Event settings
events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

# HTTP Server settings
http {
  # MIME types
  types {
    text/html               html;
    text/css                css;
    application/javascript  js;
    application/json        json;
    application/manifest+json webmanifest;
    application/xml         xml;
    text/plain              txt;
    application/wasm        wasm;
    image/png               png;
    image/svg+xml           svg;
    font/woff2              woff2;
  }
  default_type application/octet-stream;
  server_tokens off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  etag on;
  client_max_body_size 0;

  # brotli static
  brotli off;
  brotli_static on;
  brotli_types *;

  # gzip static
  gzip_static on;
  gzip_vary on;

  # A location's add_header adds to the server's set rather than replacing it.
  add_header_inherit merge;

  server {
    listen 80;
    http2 on;
    root /static;

    # The app has one page, /, so a missing file is a 404 here as it is on the edge
    error_page 404 /404.html;

    # The set src/site/headers.ts gives the edge, with always so a 404 gets it too.
    # No HSTS over plain HTTP, and no enforced frame-ancestors, since the onion portfolio frames the onion app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # scripts/nginx-conf.sh copies the policy from the build's _headers, and a build without one sends none.
    add_header Content-Security-Policy-Report-Only "@CSP_REPORT_ONLY@" always;

    location / {
      try_files $uri $uri/ =404;
      limit_except GET HEAD { deny all; }
    }

    location = /index.html {
      add_header Cache-Control "no-cache" always;
      limit_except GET HEAD { deny all; }
    }

    # The service worker is unhashed, so a cached copy would hold back every later deploy
    location = /sw.js {
      add_header Cache-Control "no-cache" always;
      limit_except GET HEAD { deny all; }
    }

    # The build fingerprints everything under here
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      limit_except GET HEAD { deny all; }
    }
  }
}
